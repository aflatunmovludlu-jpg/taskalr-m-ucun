<script>
/* ---------- 1. SETTINGS ---------- */
const CONFIG = { width: 1080, height: 1920, fps: 30, duration: 47.06, background: "#0d1440" };
// v2: voice re-recorded (Abbas, livelier). The animation was timed to the v1 voice, so draw() maps
// new-voice time -> animation time through these word anchors [newTime, animTime].
const WARP = [[0.0, 0.0], [0.056, 0.07], [3.854, 3.12], [5.742, 5.647], [9.01, 8.367], [10.13, 9.187], [11.402, 10.127], [13.643, 12.548], [15.187, 13.895], [17.471, 16.095], [19.418, 17.935], [20.199, 18.395], [21.088, 18.935], [22.514, 19.835], [24.171, 20.952], [25.912, 23.447], [28.158, 25.455], [28.491, 26.055], [29.177, 26.735], [32.547, 29.815], [35.892, 32.775], [37.404, 34.155], [39.244, 35.914], [40.133, 36.788], [41.084, 37.599], [43.175, 39.415], [45.006, 41.695], [47.06, 44.0]];
function warp(t) { for (let i = 1; i < WARP.length; i++) { const [n0, o0] = WARP[i - 1], [n1, o1] = WARP[i]; if (t <= n1) return o0 + (o1 - o0) * Math.max(0, (t - n0)) / (n1 - n0); } return WARP[WARP.length - 1][1]; }

/* ---------- 2. HELPERS (deterministic) ---------- */
const W = CONFIG.width, H = CONFIG.height;
const stage = document.getElementById("stage");
stage.width = W; stage.height = H;
const ctx = stage.getContext("2d");
function rand(seed) { let t = (seed * 2654435761 + 0x6D2B79F5) >>> 0; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = {
  inOut: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  out: k => 1 - Math.pow(1 - k, 3),
  in: k => k * k * k,
  back: k => 1 + 2.7 * Math.pow(k - 1, 3) + 1.7 * Math.pow(k - 1, 2),
};
function noise1(x, seed = 1) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(rand(i * 13 + seed * 7919), rand((i + 1) * 13 + seed * 7919), u) * 2 - 1; }
function makeGL(w = W, h = H) { const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true }); r.setPixelRatio(1); r.setSize(w, h, false); return r; }

/* ---------- 3. THE ANIMATION ---------- */
let gl;
const layer = document.createElement("canvas"); layer.width = W; layer.height = H;
let X = layer.getContext("2d");   // current drawing context for overlays
const SCENES = [];
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

// Kurzgesagt-like flat 3D material: two-tone light band + rim light + optional inner glow
function kmat(hex, o = {}) {
  const col = new THREE.Color(hex);
  const shade = o.shade !== undefined ? new THREE.Color(o.shade) : col.clone().multiplyScalar(.5).lerp(new THREE.Color(0x1a1250), .4);
  const alpha = o.alpha ?? 1;
  return new THREE.ShaderMaterial({
    uniforms: { uColor: { value: col }, uShade: { value: shade }, uRim: { value: new THREE.Color(o.rim ?? 0xbfe6ff) }, uRimK: { value: o.rimK ?? .55 }, uEmit: { value: o.emit ?? 0 }, uAlpha: { value: alpha }, uLight: { value: V3(-.55, .75, .55).normalize() } },
    vertexShader: `varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform vec3 uColor, uShade, uRim; uniform float uRimK, uEmit, uAlpha; uniform vec3 uLight; varying vec3 vN; varying vec3 vV;
      void main(){ vec3 n = normalize(vN); if(!gl_FrontFacing) n = -n; float l = dot(n, uLight); float k = smoothstep(-.25, .65, l);
        vec3 c = mix(uShade, uColor, k); float f = pow(1. - max(dot(n, vV), 0.), 2.6); c += uRim * f * uRimK; c = mix(c, uColor * 1.3 + .08, uEmit);
        gl_FragColor = vec4(c, uAlpha + f * (1. - uAlpha) * .6); }`,
    transparent: alpha < 1, depthWrite: alpha >= 1, side: o.side ?? THREE.FrontSide,
  });
}
const G = {};
function mesh(geo, mat, p = [0, 0, 0], s = 1) { const m = new THREE.Mesh(geo, mat); m.position.set(p[0], p[1], p[2]); if (typeof s === "number") m.scale.setScalar(s); else m.scale.set(s[0], s[1], s[2]); return m; }
const box = (x, y, z) => new THREE.BoxGeometry(x, y, z);
let glowTex;
function glowSprite(color, size, opacity = 1) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity })); s.scale.setScalar(size); return s; }
function o2(scale = 1, hero = false) {
  const g = new THREE.Group(); const m = kmat(0xff4d6d, { shade: 0x8e1446, rim: 0xffc2d1, rimK: .7 });
  g.add(mesh(G.sphere, m, [-.25, 0, 0], .36)); g.add(mesh(G.sphere, m, [.25, 0, 0], .36));
  const gs = glowSprite(0xff4d6d, 2.4, .5); g.add(gs); g.userData.glow = gs;
  if (hero) {
    const dark = kmat(0x1b1035, { rimK: .2 }), white = kmat(0xffffff, { rimK: 0 });
    g.add(mesh(G.sphere, dark, [0, .07, .2], [.66, .12, .24]));
    const pupils = [];
    for (const sx of [-.2, .2]) { g.add(mesh(G.sphere, white, [sx, .07, .36], .075)); const p = mesh(G.sphere, dark, [sx, .07, .42], .04); g.add(p); pupils.push(p); }
    g.userData.pupils = pupils;
  }
  const anchor = new THREE.Object3D(); anchor.position.set(0, .8, 0); g.add(anchor); g.userData.anchor = anchor;
  g.scale.setScalar(scale); return g;
}
function P(o, cam) { const v = o.isObject3D ? o.getWorldPosition(new THREE.Vector3()) : o.clone(); v.project(cam); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; }
const hex = c => "#" + new THREE.Color(c).getHexString();

// 2D text and chips (drawn on X)
function T(str, x, y, size, o = {}) {
  const a = o.a ?? 1; if (a <= .002) return;
  X.save(); X.globalAlpha = a; X.translate(x, y); const sc = o.s ?? 1; X.scale(sc, sc);
  X.font = `${o.w ?? 900} ${size}px Nunito`; X.textAlign = o.align ?? "center"; X.textBaseline = "middle";
  const mw = X.measureText(str).width, maxW = o.maxW ?? 940; if (mw > maxW) X.scale(maxW / mw, maxW / mw);
  X.shadowColor = o.glow ?? "rgba(110,170,255,.55)"; X.shadowBlur = o.blur ?? 30; X.fillStyle = o.c ?? "#fff";
  X.fillText(str, 0, 0); X.shadowBlur = 0; X.fillText(str, 0, 0); X.restore();
}
function rr(x, y, w, h, r) { X.beginPath(); X.moveTo(x + r, y); X.arcTo(x + w, y, x + w, y + h, r); X.arcTo(x + w, y + h, x, y + h, r); X.arcTo(x, y + h, x, y, r); X.arcTo(x, y, x + w, y, r); X.closePath(); }
function chip(str, x, y, size, bg, fg, a = 1, s = 1) {
  if (a <= .002) return; X.save(); X.globalAlpha = a; X.translate(x, y); X.scale(s, s);
  X.font = `900 ${size}px Nunito`; const w = X.measureText(str).width + size * 1.1, h = size * 1.55;
  X.shadowColor = bg; X.shadowBlur = 26; X.fillStyle = bg; rr(-w / 2, -h / 2, w, h, h / 2); X.fill(); X.shadowBlur = 0;
  X.fillStyle = fg; X.textAlign = "center"; X.textBaseline = "middle"; X.fillText(str, 0, size * .04); X.restore();
}
function chem(x, y, size, a = 1, col = "#ff7b95") {   // "O2" with a real subscript
  if (a <= .002) return; X.save(); X.globalAlpha = a; X.fillStyle = col; X.shadowColor = "rgba(255,77,109,.8)"; X.shadowBlur = 24; X.textBaseline = "middle";
  X.font = `900 ${size}px Nunito`; const w1 = X.measureText("O").width; X.font = `900 ${size * .55}px Nunito`; const w2 = X.measureText("2").width;
  const x0 = x - (w1 + w2) / 2; X.font = `900 ${size}px Nunito`; X.textAlign = "left"; X.fillText("O", x0, y);
  X.font = `900 ${size * .55}px Nunito`; X.fillText("2", x0 + w1, y + size * .28); X.restore();
}
function tick(x, y, r, col, a, k = 1) {   // check mark drawn on
  if (a <= .002) return; X.save(); X.globalAlpha = a; X.strokeStyle = col; X.lineWidth = r * .32; X.lineCap = X.lineJoin = "round"; X.shadowColor = col; X.shadowBlur = 20;
  const pts = [[-.55, .02], [-.15, .42], [.6, -.45]]; X.beginPath(); X.moveTo(x + pts[0][0] * r, y + pts[0][1] * r);
  const L1 = .57, L2 = 1.15, tot = L1 + L2, d = k * tot;
  if (d < L1) X.lineTo(x + lerp(pts[0][0], pts[1][0], d / L1) * r, y + lerp(pts[0][1], pts[1][1], d / L1) * r);
  else { X.lineTo(x + pts[1][0] * r, y + pts[1][1] * r); const f = (d - L1) / L2; X.lineTo(x + lerp(pts[1][0], pts[2][0], f) * r, y + lerp(pts[1][1], pts[2][1], f) * r); }
  X.stroke(); X.restore();
}
function cross(x, y, r, col, a, k = 1) {
  if (a <= .002) return; X.save(); X.globalAlpha = a; X.strokeStyle = col; X.lineWidth = r * .3; X.lineCap = "round"; X.shadowColor = col; X.shadowBlur = 20;
  const k1 = clamp(k * 2), k2 = clamp(k * 2 - 1);
  X.beginPath(); X.moveTo(x - r * .45, y - r * .45); X.lineTo(x + lerp(-.45, .45, k1) * r, y + lerp(-.45, .45, k1) * r);
  if (k2 > 0) { X.moveTo(x + r * .45, y - r * .45); X.lineTo(x + lerp(.45, -.45, k2) * r, y + lerp(-.45, .45, k2) * r); }
  X.stroke(); X.restore();
}
// pop-in / pop-out timing for overlays
function pop(t, t0, t1 = 1e9) { const k = seg(t, t0, t0 + .35), k2 = seg(t, t1 - .25, t1); return { a: k * (1 - k2), s: lerp(.72, 1, ease.back(k)) }; }

// background: vivid gradient, drifting glow blobs, twinkling stars, vignette
const STARS = Array.from({ length: 150 }, (_, i) => ({ x: rand(i * 3 + 1) * W, y: rand(i * 3 + 2) * H, r: .8 + rand(i * 3 + 3) * 2.4, ph: rand(i * 7) * 6.28, sp: .6 + rand(i * 11) * 2 }));
function background(t, bg) {
  const g = X.createLinearGradient(0, 0, 0, H); g.addColorStop(0, bg[0]); g.addColorStop(1, bg[1]); X.fillStyle = g; X.fillRect(0, 0, W, H);
  const blobs = [[.25, .78, .75, 0], [.82, .3, .55, 1], [.5, 1.02, .9, 2]];
  for (const [bx, by, br, i] of blobs) {
    const x = (bx + noise1(t * .15, i + 3) * .06) * W, y = (by + noise1(t * .12, i + 9) * .04) * H, r = br * W;
    const rg = X.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, bg[2].replace("A", i === 1 ? .16 : .26)); rg.addColorStop(1, bg[2].replace("A", 0));
    X.fillStyle = rg; X.fillRect(0, 0, W, H);
  }
  for (const s of STARS) { const a = .25 + .55 * (.5 + .5 * Math.sin(t * s.sp + s.ph)); X.globalAlpha = a; X.fillStyle = "#dfe8ff"; X.beginPath(); X.arc(s.x, s.y, s.r, 0, 7); X.fill(); }
  X.globalAlpha = 1;
}
function vignette() { const v = X.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .75); v.addColorStop(0, "rgba(5,5,25,0)"); v.addColorStop(1, "rgba(5,5,25,.55)"); X.fillStyle = v; X.fillRect(0, 0, W, H); }

function S(t0, t1, bg, build) { const s = { t0, t1, bg, scene: new THREE.Scene(), cam: new THREE.PerspectiveCamera(38, W / H, .1, 300), upd() {}, ov() {} }; build(s); SCENES.push(s); }

function buildScenes() {
  G.sphere = new THREE.SphereGeometry(1, 32, 20);
  const unitCyl = new THREE.CylinderGeometry(1, 1, 1, 64, 1, false); unitCyl.rotateZ(Math.PI / 2);   // axis along x
  const dotMat = c => new THREE.MeshBasicMaterial({ color: c });
  const dummy = new THREE.Object3D();
  const setInst = (im, i, p, s) => { dummy.position.copy(p); dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(Math.max(1e-4, s)); dummy.updateMatrix(); im.setMatrixAt(i, dummy.matrix); };

  /* ===== 1. SURPRISE: the hidden thief under the floor (0 - 5.6) ===== */
  S(0, 5.6, ["#0d1440", "#2b1660", "rgba(255,138,61,A)"], s => {
    const g = new THREE.Group(); s.scene.add(g);
    g.add(mesh(box(8, .5, 8), kmat(0x34418a), [0, -.45, 0]));
    g.add(mesh(box(8, .06, 8), kmat(0x5a6fd0), [0, -.17, 0]));
    const pts = [], R = .75, XX = 3.0;
    for (let i = 0; i < 5; i++) {
      const z = -3 + i * 1.5, dir = i % 2 ? -1 : 1;
      for (let k = 0; k <= 24; k++) { const x = -XX + 2 * XX * k / 24; pts.push(V3(dir > 0 ? x : -x, -.02, z)); }
      if (i < 4) { const cx = dir * XX; for (let k = 1; k < 14; k++) { const a = -Math.PI / 2 + Math.PI * k / 14; pts.push(V3(cx + dir * Math.cos(a) * R, -.02, z + R + Math.sin(a) * R)); } }
    }
    const curve = new THREE.CatmullRomCurve3(pts, false, "catmullrom", .2);
    const pipeMat = kmat(0xff8a3d, { emit: .3, rim: 0xffe2a8 });
    g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 900, .17, 16, false), pipeMat));
    const sp = curve.getSpacedPoints(1500);
    const dots = new THREE.InstancedMesh(G.sphere, dotMat(0xfff1c1), 70); g.add(dots);
    const tiles = [];
    for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
      const x = -3.5 + i, z = -3.5 + j, m = mesh(box(.96, .12, .96), kmat((i + j) % 2 ? 0xf3dcbc : 0xe3bf95, { rimK: .3 }), [x, .27, z]);
      g.add(m); tiles.push({ m, x, z, d: Math.hypot(x, z), r1: rand(i * 8 + j + 101), r2: rand(i * 8 + j + 301) });
    }
    const heat = []; for (let i = 0; i < 7; i++) { const sp2 = glowSprite(0xff8a3d, 3.2, 0); sp2.position.set(-2.6 + i * .87, .4, -2.4 + rand(i + 50) * 4.8); g.add(sp2); heat.push(sp2); }
    const thief = o2(1, true); s.scene.add(thief);
    s.upd = t => {
      const k = ease.inOut(seg(t, 0, 5.6));
      g.rotation.y = lerp(.62, .9, k);
      for (const o of tiles) {
        const kk = ease.inOut(seg(t, .7 + o.d * .09, 1.5 + o.d * .09));
        o.m.position.set(o.x * (1 + kk * .9), .27 + kk * 4.5, o.z * (1 + kk * .9));
        o.m.rotation.set(kk * (o.r1 - .5) * 3.5, 0, kk * (o.r2 - .5) * 3.5); o.m.scale.setScalar(Math.max(1e-3, 1 - ease.in(kk)));
      }
      for (let i = 0; i < 70; i++) { const u = (i / 70 + t * .045) % 1; const p = sp[Math.floor(u * 1499)]; setInst(dots, i, V3(p.x, p.y + .16, p.z), .055); }
      dots.instanceMatrix.needsUpdate = true;
      const rev = seg(t, 1.0, 2.8); heat.forEach((h, i) => h.material.opacity = .32 * rev * (.8 + .2 * Math.sin(t * 3 + i)));
      pipeMat.uniforms.uEmit.value = .3 + .12 * rev * (.5 + .5 * Math.sin(t * 4));
      const kp = seg(t, 3.0, 3.5), walk = ease.inOut(seg(t, 3.0, 5.6));
      thief.scale.setScalar(Math.max(1e-3, ease.back(kp)) * 1.05);
      thief.position.set(lerp(2.0, -.9, walk), 2.4 + Math.abs(Math.sin(t * 6.5)) * .16, 3.0);
      thief.rotation.set(-.35, lerp(-.5, .3, walk), Math.sin(t * 6.5) * .12);
      thief.userData.pupils.forEach((p, i) => p.position.x = (i ? .2 : -.2) + .025 * Math.sin(t * 3.2));

      for (const o of mols) {
        const ka = seg(t, o.ts - .75, o.ts), kb = seg(t, o.ts, o.ts + 1.0);
        const r = t < o.ts ? lerp(4.6, 1.3, ease.in(ka)) : lerp(1.3, 5.2, ease.out(kb));
        const th = o.th;
        o.m.position.set(o.x + (t > o.ts ? kb * .6 : 0), Math.sin(th) * r, Math.cos(th) * r);
        o.m.rotation.set(t * 1.5 + o.th0, t * 2 + o.th0, 0);
        o.m.scale.setScalar(Math.max(1e-3, .85 * seg(t, o.ts - .8, o.ts - .6) * (1 - seg(t, o.ts + .6, o.ts + 1.0))));
        const f = seg(t, o.ts - .02, o.ts + .5); o.ring.position.set(o.x, Math.sin(th) * 1.05, Math.cos(th) * 1.05);
        o.ring.material.opacity = (f > 0 && f < 1) ? (1 - f) * .95 : 0; o.ring.scale.setScalar(.6 + f * 2.2);
      }
      // heat stays inside: bore turns warm, warm dots stream out of the bore
      const warm = ease.inOut(seg(t, 32.7, 33.5));
      boreMat.uniforms.uColor.value.set(0x1f6fff).lerp(new THREE.Color(0xff8a3d), warm); boreGlow.material.color.set(0x4fc3ff).lerp(new THREE.Color(0xff9a4a), warm);
      for (let i = 0; i < 24; i++) { const u = ((rand(i + 600) + t * .5) % 1); const a = rand(i + 610) * 6.28, rr2 = Math.sqrt(rand(i + 620)) * .4; setInst(heatIn, i, V3(innerEnd - 5 + u * 5.4, Math.cos(a) * rr2, Math.sin(a) * rr2 + 0), .06 * warm * (u < .92 ? 1 : 0)); }
      heatIn.instanceMatrix.needsUpdate = true;
      for (const f of flakes) {
        const k = seg(t, f.ts, f.ts + 1.2), r = lerp(1.15, 3.2, ease.out(k));
        f.m.position.set(f.x, Math.sin(f.th) * r - k * k * 1.5, Math.cos(f.th) * r); f.m.rotation.set(k * 6 + f.th, k * 4, 0);
        f.m.scale.setScalar(Math.max(1e-3, seg(t, f.ts - .1, f.ts) * (1 - seg(t, f.ts + .8, f.ts + 1.2))));
      }
    };
    s.ov = t => {
      const a1 = pop(t, 23.5, 25.35);
      T("HƏLL SADƏDİR", W / 2, 340, 70, { a: a1.a, w: 800 });
      T("OKSİGEN BARYERİ", W / 2, 455, 112, { a: a1.a, s: a1.s, c: "#3dffc5", glow: "rgba(61,255,197,.75)" });
      const a2 = pop(t, 25.4, 29.8);
      T("METAK", W / 2, 360, 168, { a: a2.a, s: a2.s, c: "#ffffff", glow: "rgba(61,255,197,.9)", blur: 40 });
      const n = t < 25.9 ? 1 : Math.min(5, 2 + Math.floor((t - 25.9) / .22));
      const qa = pop(t, 25.95, 29.8);
      T(n + " QAT", W / 2, 500, 84, { a: qa.a, c: "#ffd166", glow: "rgba(255,200,80,.8)" });
      const a3 = pop(t, 27.15, 29.8);
      T("oksigen baryerli", W / 2, 595, 56, { a: a3.a, w: 900 }); T("yerdən isitmə borusu", W / 2, 665, 56, { a: a3.a, w: 900 });
      const [bx, by] = P(barA, s.cam); const c = pop(t, 27.3, 32.7);
      chip("OKSİGEN BARYERİ", clamp(bx - 40, 260, 820), by - 95, 40, "#3dffc5", "#06213a", c.a, c.s);
      const a4 = pop(t, 29.85, 32.75);
      T("Baryer oksigenin", W / 2, 360, 84, { a: a4.a, s: a4.s });
      T("YOLUNU KƏSİR", W / 2, 470, 104, { a: a4.a, s: a4.s, c: "#3dffc5", glow: "rgba(61,255,197,.8)" });
      const a5 = pop(t, 32.8), a6 = pop(t, 34.15);
      tick(190, 375, 80, "#7dffb0", a5.a, seg(t, 32.9, 33.4)); T("İstilik içəridə", 270, 375, 80, { a: a5.a, align: "left", c: "#ffd9a0", glow: "rgba(255,150,60,.7)", maxW: 700 });
      cross(190, 500, 80, "#ff6b6b", a6.a, seg(t, 34.2, 34.6)); T("Pas kənarda", 270, 500, 80, { a: a6.a, align: "left", maxW: 700 });
    };
  });

  /* ===== 6. PASS IT ON: send to a friend who is building a house (35.8 - 39.4) ===== */
  S(35.8, 39.4, ["#0d1c48", "#23306e", "rgba(255,209,102,A)"], s => {
    const g = new THREE.Group(); s.scene.add(g);
    function house(x, z, sc, roofCol) {
      const h = new THREE.Group(); h.position.set(x, 0, z); h.scale.setScalar(sc); g.add(h);
      h.add(mesh(box(1.8, 1.4, 1.8), kmat(0xf4e3c3, { rimK: .35 }), [0, .78, 0]));
      const roof = new THREE.CylinderGeometry(1.35, 1.35, 2.0, 3); const rm = mesh(roof, kmat(roofCol), [0, 1.95, 0], [1, 1, .62]); rm.rotation.x = -Math.PI / 2; rm.rotation.z = 0; h.add(rm);
      h.add(mesh(box(.5, .8, .05), kmat(0x6b3f2a), [-.35, .45, .91]));
      const win = kmat(0xffd166, { emit: .8, rimK: 0 }); h.add(mesh(box(.42, .42, .05), win, [.42, .95, .91]));
      const fl = kmat(0xff8a3d, { emit: .6 }); h.add(mesh(box(2.2, .14, 2.2), fl, [0, 0, 0]));
      const gw = glowSprite(0xff9a4a, 3.4, .45); gw.position.set(0, .2, 0); h.add(gw);
      return h;
    }
    const h1 = house(-1.05, 0, 1, 0xff6b4a), h2 = house(1.35, -.6, .72, 0x3dffc5);
    const planeGeo = new THREE.BufferGeometry(); planeGeo.setAttribute("position", new THREE.Float32BufferAttribute([0, 0, .5, -.35, 0, -.3, 0, .06, -.15, 0, 0, .5, 0, .06, -.15, .35, 0, -.3, 0, 0, .5, 0, .06, -.15, 0, -.18, -.25], 3)); planeGeo.computeVertexNormals();
    const plane = new THREE.Mesh(planeGeo, kmat(0xffffff, { side: THREE.DoubleSide, rimK: .3 })); g.add(plane);
    const arc = new THREE.QuadraticBezierCurve3(V3(-.6, 2.6, .6), V3(.3, 4.6, .6), V3(1.3, 1.9, -.2));
    const trail = new THREE.InstancedMesh(G.sphere, dotMat(0xfff1c1), 26); g.add(trail);
    s.upd = t => {
      s.cam.position.set(lerp(-.6, .4, ease.inOut(seg(t, 35.6, 39.6))), 3.0, 14.2); s.cam.lookAt(.15, 2.2, 0);
      h1.scale.setScalar(Math.max(1e-3, ease.back(seg(t, 35.75, 36.2))));
      h2.scale.setScalar(Math.max(1e-3, .72 * ease.back(seg(t, 36.0, 36.45))));
      const k = ease.inOut(seg(t, 36.5, 38.6)), p = arc.getPoint(k), p2 = arc.getPoint(Math.min(1, k + .01));
      plane.position.copy(p); plane.lookAt(p2); plane.scale.setScalar(Math.max(1e-3, seg(t, 36.4, 36.6) * (1 - seg(t, 38.6, 38.8)) * 1.1));
      for (let i = 0; i < 26; i++) { const kk = k - i * .014; setInst(trail, i, arc.getPoint(clamp(kk)), kk > 0 && k < .999 ? .035 * (1 - i / 26) : 0); }
      trail.instanceMatrix.needsUpdate = true;
      const land = seg(t, 38.55, 38.9) * (1 - seg(t, 38.9, 39.3)); h2.position.y = land * .15;
    };
    s.ov = t => {
      const p = pop(t, 35.9);
      T("Ev tikən dostunuza", W / 2, 360, 78, { a: p.a, s: p.s });
      T("GÖNDƏRİN", W / 2, 480, 128, { a: p.a, s: p.s, c: "#ffd166", glow: "rgba(255,200,80,.8)" });
      const p2 = pop(t, 37.4);
      T("qoy kombisi uzun ömür sürsün", W / 2, 1500, 52, { a: p2.a, w: 800 });
    };
  });

  /* ===== 7. End card (39.4 - 44.0) ===== */
  S(39.4, 44.0, ["#071a36", "#0e3a5a", "rgba(61,255,197,A)"], s => {
    const g = new THREE.Group(); s.scene.add(g); g.position.set(0, -1.9, 0);
    const pts = []; for (let i = 0; i <= 600; i++) { const th = i / 600 * Math.PI * 7; const r = .35 + th * .085; pts.push(V3(Math.cos(th) * r, 0, Math.sin(th) * r)); }
    const curve = new THREE.CatmullRomCurve3(pts);
    const coilMat = kmat(0xff8a3d, { emit: .35, rim: 0xffe2a8 });
    g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 1200, .1, 12), coilMat));
    const plate = mesh(new THREE.CylinderGeometry(2.6, 2.6, .12, 64), kmat(0x0f4f73, { rimK: .5, rim: 0x3dffc5 }), [0, -.16, 0]); g.add(plate);
    const glowC = glowSprite(0xff9a4a, 6, .45); glowC.position.set(0, .3, 0); g.add(glowC);
    const sp = curve.getSpacedPoints(800); const flow = new THREE.InstancedMesh(G.sphere, dotMat(0xfff1c1), 40); g.add(flow);
    s.upd = t => {
      g.rotation.set(.62, t * .25, 0);
      g.scale.setScalar(Math.max(1e-3, .78 * ease.back(seg(t, 39.3, 40.0))));
      for (let i = 0; i < 40; i++) { const u = (i / 40 + t * .06) % 1; const p = sp[Math.floor(u * 799)]; setInst(flow, i, V3(p.x, p.y + .1, p.z), .045); }
      flow.instanceMatrix.needsUpdate = true;
      s.cam.position.set(0, 0, 12); s.cam.lookAt(0, 0, 0);
    };
    s.ov = t => {
      const p = pop(t, 39.45);
      T("METAK", W / 2, 560, 200, { a: p.a, s: p.s * (1 + .015 * Math.sin(t * 3)), glow: "rgba(61,255,197,.95)", blur: 48 });
      const p2 = pop(t, 40.2);
      T("istiliyin etibarlı yolu", W / 2, 720, 66, { a: p2.a, s: p2.s, c: "#3dffc5", glow: "rgba(61,255,197,.7)" });
      const p3 = pop(t, 41.0);
      chip("5 qatlı · oksigen baryerli", W / 2, 850, 40, "rgba(255,255,255,.14)", "#ffffff", p3.a, p3.s);
      chip("yerdən isitmə borusu", W / 2, 935, 40, "rgba(255,255,255,.14)", "#ffffff", p3.a, p3.s);
    };
  });
}

async function setup() {
  await document.fonts.load("900 60px Nunito", "ƏəŞşĞğİıÇçÖöÜü"); await document.fonts.load("800 60px Nunito", "ƏəŞşĞğİıÇçÖöÜü"); await document.fonts.ready;
  const gc = document.createElement("canvas"); gc.width = gc.height = 128; const g2 = gc.getContext("2d");
  const rg = g2.createRadialGradient(64, 64, 0, 64, 64, 64); rg.addColorStop(0, "rgba(255,255,255,1)"); rg.addColorStop(.25, "rgba(255,255,255,.45)"); rg.addColorStop(1, "rgba(255,255,255,0)");
  g2.fillStyle = rg; g2.fillRect(0, 0, 128, 128); glowTex = new THREE.CanvasTexture(gc);
  gl = makeGL(); gl.setClearColor(0x000000, 0);
  buildScenes();
}

function drawScene(s, t) {
  X = layer.getContext("2d");
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1;
  background(t, s.bg);
  s.upd(t); s.scene.updateMatrixWorld(); s.cam.updateMatrixWorld();
  gl.render(s.scene, s.cam); X.drawImage(gl.domElement, 0, 0, W, H);
  vignette();
  const tp = X.createLinearGradient(0, 0, 0, 820); tp.addColorStop(0, "rgba(6,6,28,.55)"); tp.addColorStop(1, "rgba(6,6,28,0)"); X.fillStyle = tp; X.fillRect(0, 0, W, 820);
  s.ov(t);
}

function draw(t) { drawAnim(warp(t)); }
function drawAnim(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = CONFIG.background; ctx.fillRect(0, 0, W, H);
  const X2 = .22;
  for (const s of SCENES) {
    if (t < s.t0 - X2 || t > s.t1 + X2) continue;
    const a = s.t0 === 0 ? 1 : ease.inOut(seg(t, s.t0 - X2, s.t0 + X2));
    if (a <= 0) continue;
    drawScene(s, t);
    const z = lerp(1.07, 1, ease.out(a));
    ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.drawImage(layer, -W / 2, -H / 2); ctx.restore();
  }
}

/* ---------- 4. PLAYER + EXPORT (keep as is) ---------- */
const N = Math.round(CONFIG.duration * CONFIG.fps);
window.renderAt = t => draw(clamp(t, 0, CONFIG.duration));
window.renderFrame = f => draw(clamp(f, 0, N - 1) / CONFIG.fps);
window.CONFIG = CONFIG;

const RENDER = /[?&]render=1/.test(location.search);
if (RENDER) document.body.classList.add("render");
function fit() { if (RENDER) { stage.style.width = W + "px"; stage.style.height = H + "px"; return; } const s = Math.min(innerWidth / W, (innerHeight - 64) / H) * .94; stage.style.width = W * s + "px"; stage.style.height = H * s + "px"; }
addEventListener("resize", fit); fit();

const voice = document.getElementById("voice");
let playing = false, t0 = 0, tNow = 0;
const scrub = document.getElementById("scrub"), msg = document.getElementById("msg"), playBtn = document.getElementById("play");
function show(t) { tNow = t; draw(t); scrub.value = Math.round(t / CONFIG.duration * 1000); msg.textContent = t.toFixed(2) + " s"; }
function loop() { if (!playing) return; let t = (performance.now() - t0) / 1000; if (t >= CONFIG.duration) { t = 0; t0 = performance.now(); try { voice.currentTime = 0; voice.play(); } catch (e) {} } show(t); requestAnimationFrame(loop); }
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? "Pause" : "Play"; if (playing) { t0 = performance.now() - tNow * 1000; try { voice.currentTime = tNow; voice.play(); } catch (e) {} loop(); } else voice.pause(); };
scrub.oninput = () => { playing = false; playBtn.textContent = "Play"; voice.pause(); show(scrub.value / 1000 * CONFIG.duration); };

document.getElementById("export").onclick = async () => {
  const types = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
  const type = types.find(x => window.MediaRecorder && MediaRecorder.isTypeSupported(x));
  if (!type) { msg.textContent = "This browser can't record. Open the file in Chrome."; return; }
  playing = false; playBtn.textContent = "Play";
  const stream = stage.captureStream(CONFIG.fps);
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 16e6 });
  const parts = []; rec.ondataavailable = e => e.data.size && parts.push(e.data);
  const done = new Promise(r => rec.onstop = r);
  show(0); rec.start();
  const start = performance.now();
  await new Promise(res => { (function step() { const t = (performance.now() - start) / 1000; if (t >= CONFIG.duration) return res(); show(t); msg.textContent = "Recording " + Math.round(t / CONFIG.duration * 100) + "% (keep this tab open)"; setTimeout(step, 1000 / CONFIG.fps); })(); });
  show(CONFIG.duration - 1e-3); rec.stop(); await done;
  const blob = new Blob(parts, { type }); const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "animation." + (type.includes("mp4") ? "mp4" : "webm");
  document.body.appendChild(a); a.click(); a.remove();
  msg.textContent = "Saved " + a.download + " (video only; the MP4 render has the voice)";
};

setup().then(() => { show(0); window.ready = true; });
